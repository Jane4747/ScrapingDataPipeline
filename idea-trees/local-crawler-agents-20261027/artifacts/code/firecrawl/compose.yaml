# Based on upstream firecrawl/firecrawl docker-compose.yaml inspected 2026-10-27.
# Official prebuilt images avoid a large local source build. Pin digests after the first successful pull.
name: codex-local-firecrawl

services:
  api:
    image: ghcr.io/firecrawl/firecrawl:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      EXTRACT_WORKER_PORT: 3004
      WORKER_PORT: 3005
      ENV: local
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_URL: redis://redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:?Set FIRECRAWL_POSTGRES_PASSWORD in .env}
      USE_DB_AUTHENTICATION: "false"
      NUM_WORKERS_PER_QUEUE: 1
      CRAWL_CONCURRENT_REQUESTS: 2
      MAX_CONCURRENT_JOBS: 1
      BROWSER_POOL_SIZE: 1
      HARNESS_STARTUP_TIMEOUT_MS: 120000
      OPENAI_API_KEY: ${MODEL_API_KEY:-}
      OPENAI_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_ID:-}
    command: node dist/src/harness.js --start-docker
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_healthy
    mem_limit: 3g

  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: 2
      BLOCK_MEDIA: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    mem_limit: 256m

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    mem_limit: 512m

  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:?Set FIRECRAWL_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m

volumes:
  redis-data:
  rabbitmq-data:
  postgres-data:
